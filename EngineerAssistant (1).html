    document.body.appendChild(host);
    const close = () => { host.remove(); state.paletteOpen = false; };
    host.addEventListener('click', e => { if (e.target === host) close(); });
    const inp = $('#cmd_in', host);
    inp.focus();
    inp.addEventListener('keydown', e => {
      if (e.key === 'Escape') close();
      if (e.key === 'Enter') { const v = inp.value.trim(); close(); runCommand(v); }
    });
  }
  function runCommand(cmd) {
    if (!cmd) return;
    const lower = cmd.toLowerCase();
    try {
      if (lower.startsWith('/فراغ') || lower.startsWith('/room')) {
        const parsed = E.parseRoomCommand(cmd);
        state.pendingRoom = blankRoom(parsed.fields);
        state.pendingRoom.name = state.lang === 'ar' ? 'فراغ (أمر سريع)' : 'Room (quick cmd)';
        state.pendingRoom.openings = parsed.openings || [];
        state.view.stage = 1;
        go('#/room?pid=' + (state.cur && state.cur.pid ? state.cur.pid : '')); render();
        toast(t('cmd_ran'), 'ok'); return;
      }
      if (lower.startsWith('/تحليل_شامل') || lower.startsWith('/analyze_all')) {
        const room = curRoom(); if (!room) { toast(t('nav_room'), 'warn'); return; }
        state.view.stage = 2; render(); toast(t('cmd_ran') + ' → ' + t('st2'), 'ok'); return;
      }
      if (lower.startsWith('/تعديل_معادلة') || lower.startsWith('/set_factor')) {
        if (!S.isAdmin()) { toast(t('admin_only'), 'danger'); return; }
        const body = cmd.replace(/^\/\S+\s*/, '');
        const m = body.match(/^(.*?)\s*=\s*([\d.]+)$/);
        if (!m) { toast(t('cmd_unknown') + ' ' + t('cmd_help'), 'warn'); return; }
        const path = aliasToPath(m[1].trim());
        if (!path) { toast(t('cmd_unknown') + ': ' + m[1], 'warn'); return; }
        const d = S.db(); const oldV = getPath(d.params, path); const newV = Number(m[2]);
        setPath(d.params, path, newV); S.saveDb(d); S.markSaved();
        S.log('act_param', path, { oldVal: oldV, newVal: newV, reason: 'command palette' });
        toast(`${t('cmd_formula_ok')}: ${path} ${nf(oldV, 3)} → ${nf(newV, 3)}`, 'ok');
        render(); return;
      }
      if (lower.startsWith('/تعديل_رقم') || lower.startsWith('/set_value')) {
        const room = curRoom(); if (!room) { toast(t('nav_room'), 'warn'); return; }
        const body = cmd.replace(/^\/\S+\s*/, '');
        const m = body.match(/^(.*?)(?:\s+(qty|rate|total|كمية|سعر)\s*)?=\s*([\d.]+)(?:\s+reason=(\S+))?$/);
        if (!m) { toast(t('cmd_unknown'), 'warn'); return; }
        const code = m[1].trim().toUpperCase(); const field = (m[2] || 'total').toLowerCase(); const val = Number(m[3]); const rs = m[4] || 'command palette';
        const cr = computeRoom(room); const it = cr.items.find(x => x.code === code || x.key === code) || cr.items[0];
        if (!it) { toast(t('cmd_unknown'), 'warn'); return; }
        room.manual = room.manual || {};
        const f = field === 'سعر' ? 'rate' : field === 'كمية' ? 'qty' : field;
        room.manual[it.code] = Object.assign(room.manual[it.code] || {}, { [f]: { value: val, original: f === 'qty' ? it.qty : it.rate, reason: rs, at: S.nowISO(), by: state.user.name } });
        saveRoomNow(room, state.cur.pid);
        S.log('act_override', it.code + '.' + f + '=' + val, { itemKey: it.code, newVal: val, reason: rs });
        toast(t('cmd_value_ok') + ': ' + it.code, 'ok'); render(); return;
      }
      if (lower.startsWith('/مستخلص') || lower.startsWith('/claim')) {
        const room = curRoom(); if (!room) { toast(t('nav_room'), 'warn'); return; }
        const rest = cmd.replace(/^\/\S+\s*/, '').trim().split(/\s+/);
        const pct = rest.length > 1 ? Number(rest[rest.length - 1]) : 100;
        const con = isNaN(pct) ? rest.join(' ') : rest.slice(0, -1).join(' ');
        state.view.stage = 4; state.view.out = 4;
        state.view.claimCfg = Object.assign({}, state.view.claimCfg, { contractor: con || '', nowPct: isNaN(pct) ? 100 : pct });
        render(); toast(t('cmd_ran'), 'ok'); return;
      }
      if (lower.startsWith('/كشف_المنطق') || lower.startsWith('/logic')) {
        const room = curRoom(); if (!room) { toast(t('nav_room'), 'warn'); return; }
        const code = cmd.replace(/^\/\S+\s*/, '').trim().toUpperCase();
        const cr = computeRoom(room);
        showLogic(room, code || (cr.items[0] || {}).code, cr); return;
      }
      toast(t('cmd_unknown') + ' ' + t('cmd_help'), 'warn');
    } catch (e) { console.error(e); toast(t('err_gen'), 'danger'); }
  }
  const curRoom = () => (state.cur && state.cur.room) ? state.cur.room : null;
  function aliasToPath(s) {
    const map = {
      'أرباح': 'general.overheadPct', 'مصاريف': 'general.overheadPct', 'overhead': 'general.overheadPct', 'profit': 'general.overheadPct',
      'هالك السيراميك': 'wastage.ceramic', 'wastage.ceramic': 'wastage.ceramic', 'ceramic': 'wastage.ceramic',
      'هالك الرخام': 'wastage.marble', 'wastage.marble': 'wastage.marble',
      'هالك الدهان': 'wastage.paint', 'wastage.paint': 'wastage.paint',
      'هالك الجبسون': 'wastage.gypsum', 'wastage.gypsum': 'wastage.gypsum',
      'لاصق': 'consumption.adhesive_kg_m2', 'adhesive': 'consumption.adhesive_kg_m2',
      'دهان م²/لتر': 'consumption.paint_L_m2_per_coat', 'paint': 'consumption.paint_L_m2_per_coat',
      'تأمين': 'payment.retentionPct', 'retention': 'payment.retentionPct',
      'خصم دهان': 'deductions.paintOpeningMin', 'خصم رخام': 'deductions.marbleOpeningMin'
    };
    const k = String(s).trim();
    if (map[k]) return map[k];
    if (/^(general|wastage|prices|labor|consumption|productivity|payment|deductions|grade|std)\./.test(k)) return k;
    // fuzzy: find any param key that matches
    const keys = [];
    const P = S.params();
    Object.keys(P).forEach(sec => { if (typeof P[sec] === 'object' && !Array.isArray(P[sec])) Object.keys(P[sec]).forEach(kk => keys.push(sec + '.' + kk)); });
    const hit = keys.find(x => x.toLowerCase().indexOf(k.toLowerCase()) > -1 || k.toLowerCase().indexOf(x.split('.').pop().toLowerCase()) > -1);
    return hit || null;
  }

  /* =========================================================
     SESSION DOWNLOAD DIALOG
     ========================================================= */
  function showTextDialog(title, text, filename) {
    dialog(title, `<p class="small muted">${esc(t('download_blocked'))}</p>
      <div class="field"><label class="f">${esc(filename)}</label>
      <textarea id="txt_out" style="width:100%;height:260px;direction:ltr;text-align:left" class="mono"></textarea></div>`,
      [{ label: t('close') }, {
        label: t('copy_text'), cls: 'btn-primary', onClick: (dlg) => {
          const ta = $('#txt_out', dlg); ta.select();
          try { document.execCommand('copy'); navigator.clipboard && navigator.clipboard.writeText(ta.value).catch(() => { }); } catch (e) { }
          toast(t('copied_ok'), 'ok');
        }
      }]);
    const ta = $('#txt_out'); if (ta) { ta.value = text; }
  }
  function exportAs(kind, sc, forceText) {
    const isJson = kind === 'json';
    const name = 'engineer-assistant-' + String(sc).replace(':', '-') + '-' + S.stamp() + (isJson ? '.json' : '.csv');
    let text;
    if (isJson) {
      const payload = (sc.indexOf('user:') === 0) ? S.buildJSON({ scope: 'user', userId: sc.split(':')[1] }) : S.buildJSON({ scope: sc });
      text = JSON.stringify(payload, null, 2);
    } else {
      text = buildCsvScopeText(sc);
    }
    if (forceText) { showTextDialog(t('s_session_download'), text, name); return; }
    S.download(name, text, isJson ? 'application/json' : 'text/csv');
    if (S.storageMode() === 'memory') setTimeout(() => showTextDialog(t('s_session_download'), text, name), 700);
  }
  function buildCsvScopeText(sc) {
    const d = S.db(); const rows = [[t('project_name'), t('room_name'), 'L', 'W', 'H', t('cf_floor'), t('cf_walls'), t('qs_code'), t('qs_desc'), t('qs_unit'), t('qs_qty'), t('dt_price'), t('qs_total')]];
    let projs = d.projects;
    if (sc === 'me') projs = d.projects.filter(p => p.ownerId === state.user.id);
    if (sc.indexOf('user:') === 0) projs = d.projects.filter(p => p.ownerId === sc.split(':')[1]);
    projs.forEach(p => (p.rooms || []).forEach(r => {
      const items = r.items || [];
      if (!items.length) rows.push([p.name, r.name, r.fields.L, r.fields.W, r.fields.H, r.net.floor, r.net.wallNet, '', '', '', '', '', '']);
      items.forEach(it => rows.push([p.name, r.name, r.fields.L, r.fields.W, r.fields.H, r.net.floor, r.net.wallNet, it.code, t(it.descKey), it.unit, it.qty, it.rate, it.total]));
    }));
    return S.buildCSV(rows);
  }
  function sessionDownloadDialog() {
    dialog(t('s_session_download'), `
      <p class="small muted">${esc(t('s_session_hint'))}</p>
      <div class="field"><label class="f">${esc(t('s_scope'))}</label>
        <select id="dl_scope2"><option value="me">${esc(t('sc_me'))}</option>
        ${S.isAdmin() ? `<option value="all">${esc(t('sc_all'))}</option>` : ''}
        ${S.isAdmin() ? S.users().map(u => `<option value="user:${u.id}">${esc(t('sc_user'))}: ${esc(u.name)}</option>`).join('') : ''}</select></div>
      <div class="field"><label class="f">${esc(t('s_format'))}</label>
        <select id="dl_fmt2"><option value="json">${esc(t('json_full'))}</option><option value="csv">${esc(t('csv_qty'))}</option></select></div>`,
      [{ label: t('cancel') }, {
        label: t('view_text'), onClick: (dlg) => {
          const sc = $('#dl_scope2', dlg).value, fmt = $('#dl_fmt2', dlg).value;
          exportAs(fmt, sc, true); S.writeLocalSnapshot();
        }
      }, {
        label: t('s_session_download'), cls: 'btn-primary', onClick: (dlg) => {
          const sc = $('#dl_scope2', dlg).value, fmt = $('#dl_fmt2', dlg).value;
          exportAs(fmt, sc, false);
          S.writeLocalSnapshot();
        }
      }]);
  }

  /* =========================================================
     BOOT
     ========================================================= */
  function bootError(e) {
    const app = $('#app');
    if (!app) return;
    app.innerHTML = `<div class="login-wrap"><div class="card login-card">
      <h3>⚠ ${esc(t('err_gen'))}</h3>
      <p class="small muted">${esc((e && e.message) || '')}</p>
      <div class="btnrow"><button class="btn-primary" onclick="location.reload()">${esc(t('save')) === 'Save' ? 'Reload' : 'إعادة التحميل'}</button></div>
      <details class="small muted"><summary>تفاصيل تقنية</summary><pre class="mono" style="white-space:pre-wrap">${esc(((e && e.stack) || '').slice(0, 600))}</pre></details>
    </div></div>`;
  }
  async function boot() {
    try { state.theme = S.lsGet('ea_theme', 'light') || 'light'; } catch (e) { }
    applyTheme(state.theme);
    await S.seedIfNeeded();
    const u = S.currentUser();
    state.user = u;
    applyLang(u ? (S.settings().lang || 'ar') : 'ar');
    // autosave loop (1s tick)
    setInterval(() => {
      if (!state.user) return;
      const at = S.autoSaveTick();
      if (at) { tickSessionBar(); }
      else tickSessionBar();
    }, 1000);
    // crash-safety: persist a local snapshot on every unload/visibility change
    const snapWrite = () => { if (state.user) S.writeLocalSnapshot(); };
    window.addEventListener('beforeunload', snapWrite);
    document.addEventListener('visibilitychange', () => { if (document.hidden) snapWrite(); });
    // keyboard: Ctrl+K palette, "/" for palette when not typing
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
      if (e.key === '/' && !/input|textarea|select/i.test((e.target || {}).tagName || '')) { e.preventDefault(); openPalette(); }
      if (e.key === 'Escape' && $('#cmdk')) $('#cmdk').remove();
    });
    render();
    if (S.storageMode() === 'memory') toast(t('ls_blocked'), 'warn');
  }
  document.addEventListener('DOMContentLoaded', () => { boot().catch(e => { console.error(e); bootError(e); }); });
  window.addEventListener('error', (ev) => { if (!document.querySelector('.login-card, .topbar')) { try { bootError(ev.error || ev); } catch (e) {} } });
})();

</script>
