  <style>
/* =========================================================
   Engineer Assistant — styles (RTL-first, responsive, printable)
   ========================================================= */
:root{
  --bg:#f2f5f9; --panel:#ffffff; --panel-2:#f8fafc; --ink:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --brand:#0d6c5c; --brand-2:#0f8a74; --brand-ink:#e7f6f2;
  --accent:#b45309; --danger:#b91c1c; --ok:#15803d; --warn:#a16207; --info:#1d4ed8;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -18px rgba(15,23,42,.35);
  --radius:14px; --radius-s:9px; --fs:15px;
}
[data-theme="dark"]{
  --bg:#0b1220; --panel:#101a2c; --panel-2:#0e1728; --ink:#e5edf7; --muted:#93a4bd;
  --line:#1e2c45; --brand:#2fb59b; --brand-2:#3fd0b3; --brand-ink:#062420;
  --accent:#f59e0b; --danger:#f87171; --ok:#4ade80; --warn:#fbbf24; --info:#82aaff;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:var(--fs);
  font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic","Helvetica Neue",Arial,sans-serif;
  line-height:1.65; -webkit-text-size-adjust:100%;
}
[dir="rtl"] body{font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic","Cairo",Arial,sans-serif}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:.2em 0 .5em;line-height:1.3}
small,.small{font-size:.82em}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;font-size:.86em;direction:ltr;text-align:left}
.hidden{display:none !important}
.center{text-align:center}
.right{text-align:end}
.nowrap{white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;box-shadow:var(--shadow)}
[data-theme="dark"] .topbar{background:#0c2a26}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.brand .logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:17px}
.brand small{display:block;font-weight:400;opacity:.85;font-size:.72em}
.spacer{flex:1}
.topbar .who{font-size:.8em;opacity:.92;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap;background:rgba(255,255,255,.12);padding:4px;border-radius:12px}
.nav a{color:#fff;padding:6px 11px;border-radius:9px;font-size:.88em;opacity:.92}
.nav a:hover{background:rgba(255,255,255,.16);opacity:1}
.nav a.active{background:#fff;color:var(--brand);font-weight:700}
@media(max-width:900px){
  .nav{order:5;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .nav a{white-space:nowrap}
}

/* ---------- cards & layout ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card>h3{margin-top:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-sub{color:var(--muted);font-size:.88em;margin:-4px 0 10px}
.section-title{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0 10px;font-size:1.02em}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-ink);color:var(--brand);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.76em;font-weight:600}
[data-theme="dark"] .chip{background:#0d2a26;color:var(--brand-2)}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.danger{background:#fee2e2;color:#991b1b}
.chip.info{background:#e0e7ff;color:#3730a3}
.chip.ok{background:#dcfce7;color:#166534}
[data-theme="dark"] .chip.warn{background:#3a2c0a;color:#fbbf24}
[data-theme="dark"] .chip.danger{background:#3a1414;color:#fca5a5}
[data-theme="dark"] .chip.info{background:#1b2447;color:#a5b4fc}
[data-theme="dark"] .chip.ok{background:#0f2a1a;color:#86efac}
.stage-badge{background:var(--brand);color:#fff;border-radius:var(--radius-s);padding:6px 12px;font-weight:700;display:inline-block;font-size:.9em}
.stage-badge.s2{background:#1d4ed8}.stage-badge.s3{background:#7c3aed}.stage-badge.s4{background:#b45309}

/* ---------- forms ---------- */
label.f{display:block;font-size:.85em;font-weight:600;color:var(--muted);margin-bottom:3px}
input,select,textarea,button{font-family:inherit;font-size:1em}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--panel-2);color:var(--ink);outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,108,92,.15)}
input[readonly]{background:transparent;color:var(--muted)}
.field{margin-bottom:10px}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline>*{flex:1;min-width:130px}
.inline .fit{flex:0 0 auto;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9em;padding:6px 0}
.check input{width:auto}
button,.btn{
  cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  padding:9px 14px;border-radius:var(--radius-s);font-weight:600;display:inline-flex;align-items:center;gap:7px
}
button:hover,.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2);color:#fff}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{color:#fff;filter:brightness(1.05)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 9px;font-size:.84em}
.btn-lg{padding:12px 20px;font-size:1.05em}
button:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--panel-2);font-size:.84em;color:var(--muted);text-transform:none;position:sticky;top:0;z-index:1}
tbody tr:hover{background:rgba(13,108,92,.045)}
tfoot td{font-weight:700;background:var(--panel-2)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.matrix-tab td.act{color:var(--brand);font-weight:700}
.matrix-tab td.ov{color:var(--accent);font-weight:700}
tr.is-overridden td{background:rgba(180,83,9,.06)}
.mini{font-size:.8em;color:var(--muted)}
.eq-note{background:var(--panel-2);border:1px dashed var(--line);border-radius:var(--radius-s);padding:10px 12px;margin-top:10px}
.eq-note h4{margin:0 0 6px;font-size:.9em}
.eq-note ul{margin:0;padding-inline-start:18px}
.eq-note li{margin-bottom:4px}

/* ---------- menu cards (Stage 3) ---------- */
.menu{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:780px){.menu{grid-template-columns:1fr}}
.menu-item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius-s);padding:14px;cursor:pointer;text-align:start}
.menu-item:hover{border-color:var(--brand);background:var(--brand-ink)}
.menu-item .n{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.menu-item b{display:block;margin-bottom:2px}

/* ---------- misc ---------- */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi .v{font-size:1.5em;font-weight:700;color:var(--brand)}
.kpi .k{color:var(--muted);font-size:.84em}
.toast-host{position:fixed;inset-block-end:16px;inset-inline-start:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);animation:tin .2s ease-out;font-size:.9em}
.toast.ok{background:var(--ok)}.toast.danger{background:var(--danger)}.toast.warn{background:var(--warn)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);max-width:520px;width:92vw;padding:0}
dialog::backdrop{background:rgba(2,6,23,.55)}
dialog .dlg-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
dialog .dlg-b{padding:14px}
dialog .dlg-f{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.session-bar{position:fixed;inset-block-end:0;inset-inline:0;z-index:60;background:var(--panel);border-top:1px solid var(--line);
  display:flex;gap:10px;align-items:center;padding:7px 12px;box-shadow:0 -6px 18px -14px rgba(0,0,0,.4);flex-wrap:wrap;font-size:.84em}
.session-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.session-bar.dirty .dot{background:var(--warn)}
.pad-bottom{padding-bottom:74px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px}
.bad{color:var(--danger);font-weight:600;font-size:.88em}
.good{color:var(--ok);font-weight:600;font-size:.88em}
.bar{height:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.detail-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.detail-row:last-child{border-bottom:0}
.glass{background:linear-gradient(180deg,rgba(13,108,92,.06),transparent);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
.cmdk{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:80;display:grid;place-items:start center;padding-top:9vh}
.cmdk .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:min(680px,94vw);box-shadow:var(--shadow);overflow:hidden}
.cmdk input{border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:1.05em;padding:14px}
.cmdk .hints{padding:10px 14px;font-size:.82em;color:var(--muted)}
.cmdk .hints code{background:var(--panel-2);padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block;margin:2px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border-radius:999px;padding:6px 13px;font-size:.86em}
.tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82em;color:var(--muted);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-inline-end:4px}
.rtl-flip{direction:ltr}
@media print{
  .topbar,.session-bar,.nav,.no-print,button,.tabs,.cmdk{display:none !important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border-color:#999;break-inside:avoid}
  table{min-width:0}
  th,td{border-color:#999}
}

</style>
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <div class="card login-card center">
        <div style="width:56px;height:56px;border-radius:16px;background:#0d6c5c;color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 8px">⚙</div>
        <h2 style="margin:0">Engineer Assistant</h2>
        <p class="muted">جاري التحميل… / Loading…</p>
      </div>
    </div>
  </div>

  <noscript>
    <div class="wrap" style="padding:20px">
      <div class="card"><b>يتطلب هذا التطبيق تشغيل JavaScript.</b><br>This application requires JavaScript to be enabled.</div>
    </div>
  </noscript>

  <script>
/* ==== defaults.js ==== */
/* =========================================================
   Engineer Assistant — Defaults (Version 1)
   القيم القياسية القابلة للتعديل من داخل الموقع بواسطة الأدمن
   All defaults below are editable from the Parameters page (admin only)
   ========================================================= */
(function (global) {
  'use strict';

  /* ---------- 1) Parameters (admin-editable, glass-box engine inputs) ---------- */
  const DEFAULT_PARAMS = {
    general: {
      currencyAr: 'ج.م',
      currencyEn: 'EGP',
      overheadPct: 32.25,           // مصاريف عمومية + أرباح
      equipmentPctOfLabor: 3,       // معدات كنسبة من العمالة
      flooringMethod: 'adhesive',   // adhesive = لاصق Sitox U | mortar = مونة أسمنتية

    },

      doorW: 1.0, doorH: 2.2,
      winW: 1.2, winH: 1.5
    },
    wastage: {                       // نسب الهالك %
      ceramic: 3, marble: 5, paint: 2, gypsum: 5,
      cement: 2, sand: 3, adhesive: 5, hdf: 3, skirting: 3
    },
    prices: {                        // أسعار الخامات (للوحدة)
      ceramic_tile: { unit: 'm²', price: 250, waste: 'ceramic' },
      marble: { unit: 'm²', price: 950, waste: 'marble' },
      hdf: { unit: 'm²', price: 180, waste: 'hdf' },
      underlay: { unit: 'm²', price: 25, waste: 'hdf' },
      skirting: { unit: 'm', price: 95, waste: 'skirting' },
      adhesive: { unit: 'kg', price: 9, waste: 'adhesive' },      // Sitox U
      grout: { unit: 'kg', price: 20, waste: 'adhesive' },
      cement: { unit: 'bag', price: 200, waste: 'cement' },
      sand: { unit: 'm³', price: 250, waste: 'sand' },
      putty: { unit: 'kg', price: 12, waste: 'paint' },
      primer: { unit: 'L', price: 55, waste: 'paint' },
      paint: { unit: 'L', price: 68, waste: 'paint' },
      gypsum_board: { unit: 'm²', price: 78, waste: 'gypsum' },
      cd_profile: { unit: 'm', price: 28, waste: 'gypsum' },
      screws: { unit: 'pc', price: 0.75, waste: 'gypsum' },
      joint_comp: { unit: 'kg', price: 18, waste: 'gypsum' },
      cornice: { unit: 'm', price: 85, waste: 'gypsum' }
    },
    labor: {                         // أسعار العمالة (للوحدة)
      floor_ceramic: 120, floor_marble: 180, floor_hdf: 35,
      skirting: 35, wall_paint: 45, wall_tiles: 130,
      ceil_gypsum: 110, ceil_paint: 45, cornice: 25
    },
    productivity: {                  // معدلات الإنتاجية اليومية وحجم الطقم (pillar 5)
      floor_ceramic: { rate: 15, unit: 'm²', crew: 3 },
      floor_marble: { rate: 8, unit: 'm²', crew: 3 },
      floor_hdf: { rate: 35, unit: 'm²', crew: 2 },
      skirting: { rate: 30, unit: 'm', crew: 2 },
      wall_paint: { rate: 60, unit: 'm²', crew: 2 },
      wall_tiles: { rate: 12, unit: 'm²', crew: 3 },
      ceil_gypsum: { rate: 12, unit: 'm²', crew: 3 },
      cornice: { rate: 30, unit: 'm', crew: 2 }
    },
    payment: {                       // شروط الصرف الافتراضية

  /* ---------------- admin helpers ---------------- */
  function stats() {

  }

  global.EA_STORE = {
    K, uid, nowISO, lsGet, lsSet, lsDel, storageMode, sha256, kdf,

    session, setSession, currentUser, isAdmin, log,

  <script>
/* ==== engine.js ==== */
/* =========================================================
   Engineer Assistant — Calculation Engine (Glass-Box)
   كل معادلة تُعاد كسلسلة نصية قابلة للمراجعة: [Equation: Output = Formula(Inputs)]
   The engine is pure: computeRoom(room, params) → { net, items, procurement, qc, wbs, formulas }
   ========================================================= */
(function (global) {
  'use strict';

  /* ---------- Engine-side supplementary defaults (merged into params) ---------- */
  const SUP = {
    general: { kitchenTilePerimeterFactor: 0.75, wallPlasterThickness: 1.5 },
    consumption: {
      adhesive_kg_m2: 4.5, grout_kg_m2: 0.5,
      mortar_cement_bag_m2: 0.18, mortar_sand_m3_m2: 0.02,
      levelling_cement_bag_m2: 0.25,
      putty_kg_m2: 1.2, primer_L_m2: 0.12, paint_L_m2_per_coat: 0.15,
      cd_m_m2: 2.5, screws_pc_m2: 20, joint_kg_m2: 0.4,
      plaster_cement_bag_m2: 0.25, plaster_sand_m3_m2: 0.02
    },
    prices: {
      skirting_ceramic: { unit: 'm', price: 70, waste: 'skirting' },
      skirting_marble: { unit: 'm', price: 220, waste: 'marble' },
      skirting_hdf: { unit: 'm', price: 95, waste: 'skirting' }
    },
    labor: { plaster: 55, ceil_gypsum_extra: 0 },
    grade: { eco: 0.8, std: 1.0, prem: 1.5 }
  };

  function mergeDeep(base, extra) {
    const out = Object.assign({}, base);
    Object.keys(extra).forEach(k => {
      out[k] = (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]))
        ? mergeDeep(base[k], extra[k]) : (base[k] !== undefined ? base[k] : extra[k]);
    });
    return out;
  }
  function ensureParams(p) {
    const out = mergeDeep(JSON.parse(JSON.stringify(global.EA_DEFAULTS.DEFAULT_PARAMS)), {});
    if (!p) return mergeDeep(out, SUP);
    ['general', 'deductions', 'wastage', 'prices', 'labor', 'productivity', 'payment', 'consumption', 'grade', 'std'].forEach(sec => {
      out[sec] = Object.assign({}, out[sec] || {}, SUP[sec] ? SUP[sec] : {}, p[sec] || {});
    });
    if (p.milestones) out.milestones = p.milestones;
    return out;
  }

  const num = (v, d) => { const n = Number(v); return isFinite(n) ? n : (d || 0); };
  const r2 = (n) => Math.round(num(n) * 100) / 100;
  const r3 = (n) => Math.round(num(n) * 1000) / 1000;
  const pct = (n) => r2(num(n) * 100);

  /* ---------------- geometry / take-off ---------------- */
  function normalizeRoom(room) {
    const f = room.fields || {};
    const L = num(f.L), W = num(f.W), H = num(f.H);
    let perimeter;
    if (f.shape === 'circle') perimeter = 2 * Math.PI * (L / 2);
    else perimeter = 4 * Math.sqrt(Math.max(L * W, 0));                 // equal-area rectangle approximation
    if (num(f.wallsZeroCorner) > 0) perimeter = num(f.wallsZeroCorner);
    const plasterP = num(f.plasterP) > 0 ? num(f.plasterP) : perimeter;
    return {
      L, W, H, shape: f.shape || 'rect',
      perimeter: r2(perimeter),
      plasterP: r2(plasterP),
      tilesH: num(f.tilesH) > 0 ? num(f.tilesH) : Math.min(num(f.tilesDefaultH, 2.2), H || 2.2)
    };
  }

  function openingList(room) {
    return (room.openings || []).map(o => ({ name: o.name || '', type: o.type || 'other', w: num(o.w), h: num(o.h), q: Math.max(1, num(o.q, 1)), area: num(o.w) * num(o.h) }))
      .filter(o => o.area > 0);
  }

  function computeRoom(room, paramsIn) {
    const P = ensureParams(paramsIn);
    const g = normalizeRoom(room);
    const ops = openingList(room);
    const f = room.fields || {};
    const cert = [];

    const floorNet = Math.max(g.L * g.W, 0);
    cert.push({ key: 'eq_floor', txt: `Net_Floor = (L × W) = (${g.L} × ${g.W}) = ${r2(floorNet)} m²` });

    // deduction per finish class (threshold rules)
    const ded = (minA) => ops.reduce((s, o) => s + (o.area >= num(minA, 1) ? o.area * o.q : 0), 0);
    const paintDed = ded(P.deductions.paintOpeningMin);
    const tileDed = ded(P.deductions.ceramicOpeningMin);
    const marbleDed = ded(P.deductions.marbleOpeningMin);
    const gypsumDed = ded(P.deductions.gypsumOpeningMin);

    const wallGross = g.perimeter * g.H;
    const plasterGross = g.plasterP * g.H;
    const wallNetPaint = Math.max(wallGross - paintDed, 0);
    cert.push({ key: 'eq_wall', txt: `Wall_Net(Paint) = (P × H) − Σ Openings(area ≥ ${P.deductions.paintOpeningMin} m²) = (${g.perimeter} × ${g.H}) − ${r2(paintDed)} = ${r2(wallNetPaint)} m²` });

    // tiled walls
    const wt = f.wallType || 'paint';
    let tilePerim = 0;
    if (wt === 'tiles' || wt === 'both') {
      tilePerim = (f.roomType === 'kitchen') ? g.perimeter * num(P.general.kitchenTilePerimeterFactor, 0.75) : g.perimeter;
    }
    const tilesH = wt === 'both' ? Math.min(g.tilesH, g.H) : (f.tilesFullHeight === 'yes' ? g.H : Math.min(g.tilesH, g.H));
    const wallTilesGross = tilePerim * (wt === 'tiles' || wt === 'both' ? tilesH : 0);
    const wallTilesNet = Math.max(wallTilesGross - (wallTilesGross > 0 ? tileDed : 0), 0);
    if (wallTilesNet > 0) cert.push({ key: 'eq_wall_tiles', txt: `Wall_Tiles = (P_tiles = ${r2(tilePerim)} × h_tiles = ${r2(tilesH)}) − Openings(≥${P.deductions.ceramicOpeningMin} m²) = ${r2(wallTilesNet)} m²` });

    const paintOnWalls = wt === 'tiles' ? 0 : Math.max(wallNetPaint - wallTilesNet, 0);
    cert.push({ key: 'eq_wall_paint', txt: `Wall_Paint = Wall_Net − Wall_Tiles = ${r2(wallNetPaint)} − ${r2(wallTilesNet)} = ${r2(paintOnWalls)} m²` });

    const ceilNet = floorNet; // flat ceiling mirrors floor plan in this model
    cert.push({ key: 'eq_ceil', txt: `Ceil_Net = Floor_Net = ${r2(ceilNet)} m²` });

    const ct = f.ceilingType || 'cornice';
    let gypArea = 0;
    if (ct === 'gypsum') gypArea = num(f.gypsumArea) > 0 ? Math.min(num(f.gypsumArea), ceilNet) : ceilNet;
    const ceilPaintArea = Math.max(ceilNet - gypArea, 0) - (f.paintCeiling === 'no' ? 0 : 0);
    if (gypArea > 0) cert.push({ key: 'eq_gypsum', txt: `Gypsum_Area = min(Input, Ceil_Net) = ${r2(gypArea)} m²` });

    const doorW = ops.filter(o => o.type === 'door').reduce((s, o) => s + o.w * o.q, 0);
    const skirting = (f.skirting && f.skirting !== 'none') ? Math.max(g.perimeter - doorW, 0) : 0;
    if (skirting > 0) cert.push({ key: 'eq_skirt', txt: `Skirting_L = P − Σ Door widths = ${g.perimeter} − ${r2(doorW)} = ${r2(skirting)} m` });

    const cornice = (ct === 'cornice' || ct === 'gypsum') ? g.perimeter : 0;
    if (cornice > 0) cert.push({ key: 'eq_perim', txt: `Cornice_L = Ceiling perimeter P = ${r2(cornice)} m` });

    const dedSteps = ops.map(o => ({ name: o.name || o.type, w: o.w, h: o.h, q: o.q, area: r2(o.area), n: o.q, tot: r2(o.area * o.q), paint: o.area >= num(P.deductions.paintOpeningMin, 1), tile: o.area >= num(P.deductions.ceramicOpeningMin, 1), marble: o.area >= num(P.deductions.marbleOpeningMin, 0.5) }));

    const net = {
      floor: r2(floorNet), wallGross: r2(wallGross), wallNet: r2(wallNetPaint), plasterGross: r2(plasterGross),
      ceil: r2(ceilNet), gypsum: r2(gypArea), cornice: r2(cornice), skirting: r2(skirting),
      tiles: r2(wallTilesNet), paintWalls: r2(paintOnWalls), ceilPaint: r2(ceilPaintArea),
      perimeter: r2(g.perimeter), plasterP: r2(g.plasterP),
      openingsCount: ops.reduce((s, o) => s + o.q, 0),
      openingsGross: r2(ops.reduce((s, o) => s + o.area * o.q, 0)),
      deduct: { paint: r2(paintDed), tiles: r2(tileDed), marble: r2(marbleDed), gypsum: r2(gypsumDed) },
      L: g.L, W: g.W, H: g.H, tilesH: r2(tilesH)
    };
    return { net, formula: cert, dedSteps, geom: g };
  }

  /* ---------------- material / labor rate helpers ---------------- */
  function matPrice(P, key) { return num((P.prices[key] || {}).price); }
  function matUnit(P, key) { return (P.prices[key] || {}).unit || 'u'; }
  function wasteOf(P, key) {
    const w = (P.prices[key] || {}).waste;
    return w && P.wastage[w] != null ? num(P.wastage[w]) : 0;
  }
  function matLine(P, key, netQty, gradeFactor) {
    const w = wasteOf(P, key);
    const total = netQty * (1 + w / 100);
    const price = matPrice(P, key) * (gradeFactor || 1);
    return { key, net: r3(netQty), unit: matUnit(P, key), waste: w, qty: r3(total), wasteQty: r3(total - netQty), price: r2(price), amount: r2(total * price) };
  }

  /* ---------------- items builder ---------------- */
  function buildItems(room, paramsIn, net) {
    const P = ensureParams(paramsIn);
    const f = room.fields || {};
    const c = P.consumption;
    const gf = num(P.grade[f.ceramicGrade || 'std'], 1);
    const items = [];
    const push = (o) => { if (o && o.qty > 0.0001) items.push(o); };

    function roll(matLines, laborCost, qty, unit, code, descKey, eq, desc) {
      const matCost = matLines.reduce((s, m) => s + m.amount, 0);
      const equip = r2(laborCost * num(P.general.equipmentPctOfLabor) / 100);
      const direct = r2(matCost + laborCost + equip);
      const oh = r2(direct * num(P.general.overheadPct) / 100);
      const total = r2(direct + oh);
      return {
        code, key: code, descKey, desc: desc || '', eq, unit, qty: r3(qty),
        mat: matLines, matCost: r2(matCost), labor: r2(laborCost), equip, direct, oh, total,
        rate: qty > 0 ? r2(total / qty) : 0,
        ohPct: num(P.general.overheadPct), equipPct: num(P.general.equipmentPctOfLabor),
        wasteNote: matLines.map(m => m.key + ':' + m.waste + '%').join(' | ')
      };
    }

    /* 1) Floors */
    const fl = f.flooring || 'none';
    if (fl === 'ceramic' || fl === 'marble') {
      const mats = [];
      const key = fl === 'ceramic' ? 'ceramic_tile' : 'marble';
      const spendKey = 'floor_ceramic', labKey = fl === 'ceramic' ? 'floor_ceramic' : 'floor_marble';
      if (fl === 'ceramic') mats.push(matLine(P, 'ceramic_tile', net.floor, gf));
      else mats.push(matLine(P, 'marble', net.floor));
      if ((P.general.flooringMethod || 'adhesive') === 'adhesive' && fl === 'ceramic') {
        mats.push(matLine(P, 'adhesive', net.floor * num(c.adhesive_kg_m2)));
        mats.push(matLine(P, 'grout', net.floor * num(c.grout_kg_m2)));
      } else {
        mats.push(matLine(P, 'cement', net.floor * num(c.mortar_cement_bag_m2)));
        mats.push(matLine(P, 'sand', net.floor * num(c.mortar_sand_m3_m2)));
      }
      push(roll(mats, net.floor * num(P.labor[labKey]), net.floor, 'm²',
        fl === 'ceramic' ? 'FLR-CER-01' : 'FLR-MAR-01',
        fl === 'ceramic' ? 'item_floor_ceramic' : 'item_floor_marble',
        `Area = ${net.floor} m² | Material = Area × (1 + waste) | Labor = ${net.floor} × ${P.labor[labKey]} | Direct = Σ Mat + Labor + Equip(${P.general.equipmentPctOfLabor}%) | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }
    if (fl === 'hdf') {
      const mats = [matLine(P, 'hdf', net.floor), matLine(P, 'underlay', net.floor)];
      push(roll(mats, net.floor * num(P.labor.floor_hdf), net.floor, 'm²', 'FLR-HDF-01', 'item_floor_hdf',
        `Area = ${net.floor} m² | HDF = Area × (1 + ${wasteOf(P, 'hdf')}%) | Underlay = Area | Labor = Area × ${P.labor.floor_hdf} | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }

    /* 2) Skirting */
    if (net.skirting > 0) {
      const sk = f.skirting;
      const key = sk === 'marble' ? 'skirting_marble' : (sk === 'hdf' ? 'skirting_hdf' : 'skirting_ceramic');
      const labKey = sk === 'marble' ? 'floor_marble' : (sk === 'hdf' ? 'floor_hdf' : 'floor_ceramic');
      const mats = [matLine(P, key, net.skirting, 1)];
      if (sk !== 'hdf') mats.push(matLine(P, (P.general.flooringMethod === 'adhesive' ? 'adhesive' : 'cement'), net.skirting * (P.general.flooringMethod === 'adhesive' ? 0.6 : 0.05)));
      const cutNote = ' (سمك القطعة ' + (f.skirtingH ? f.skirtingH : 10) + ' سم من بلاطة 60×60 → سعر المتر الطولي محسوب على القطع)';
      push(roll(mats, net.skirting * num(P.labor.skirting || P.labor.floor_ceramic * 0.3), net.skirting, 'm', 'SKR-01', 'item_skirting',
        `Length = P − Σ Doors = ${net.skirting} m | Material ${key} = Length × (1 + waste) | Labor = ${net.skirting} × ${P.labor.skirting} | Total = Direct × (1 + ${P.general.overheadPct}%)` + cutNote));
    }

    /* 3) Walls */
    if (net.paintWalls > 0) {
      const coats = num(P.general.wallPaintCoats, 2);
      const mats = [
        matLine(P, 'putty', net.paintWalls * num(c.putty_kg_m2)),
        matLine(P, 'primer', net.paintWalls * num(c.primer_L_m2)),
        matLine(P, 'paint', net.paintWalls * num(c.paint_L_m2_per_coat) * coats)
      ];
      push(roll(mats, net.paintWalls * num(P.labor.wall_paint), net.paintWalls, 'm²', 'WAL-PNT-01', 'item_wall_paint',
        `Area = (P×H) − Openings = ${net.paintWalls} m² | Paint = Area × ${c.paint_L_m2_per_coat} L/m² × ${coats} coats × (1 + ${wasteOf(P, 'paint')}%) | Labor = Area × ${P.labor.wall_paint} | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }
    if (net.tiles > 0) {
      const mats = [matLine(P, 'ceramic_tile', net.tiles, gf), matLine(P, 'adhesive', net.tiles * num(c.adhesive_kg_m2)), matLine(P, 'grout', net.tiles * num(c.grout_kg_m2))];
      push(roll(mats, net.tiles * num(P.labor.wall_tiles), net.tiles, 'm²', 'WAL-TIL-01', 'item_wall_tiles',
        `Area = (P_tiles × h_tiles) − Openings = ${net.tiles} m² | Tile = Area × (1 + ${wasteOf(P, 'ceramic_tile')}%) | Adhesive = Area × ${c.adhesive_kg_m2} kg/m² | Labor = Area × ${P.labor.wall_tiles} | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }

    /* 4) Plaster */
    if (f.plaster === 'yes' && net.plasterGross > 0) {
      const mats = [matLine(P, 'cement', net.plasterGross * num(c.plaster_cement_bag_m2)), matLine(P, 'sand', net.plasterGross * num(c.plaster_sand_m3_m2))];
      push(roll(mats, net.plasterGross * num(P.labor.plaster), net.plasterGross, 'm²', 'WAL-PLS-01', 'item_plaster',
        `Area = (P_plaster × H) = ${net.plasterGross} m² | Cement = Area × ${c.plaster_cement_bag_m2} bag/m² | Labor = Area × ${P.labor.plaster} | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }

    /* 5) Ceiling */
    if (net.gypsum > 0) {
      const mats = [
        matLine(P, 'gypsum_board', net.gypsum),
        matLine(P, 'cd_profile', net.gypsum * num(c.cd_m_m2)),
        matLine(P, 'screws', net.gypsum * num(c.screws_pc_m2)),
        matLine(P, 'joint_comp', net.gypsum * num(c.joint_kg_m2))
      ];
      push(roll(mats, net.gypsum * num(P.labor.ceil_gypsum), net.gypsum, 'm²', 'CEL-GYP-01', 'item_gypsum',
        `Area = ${net.gypsum} m² | Board = Area × (1 + ${wasteOf(P, 'gypsum_board')}%) | CD = Area × ${c.cd_m_m2} m/m² | Labor = Area × ${P.labor.ceil_gypsum} | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }
    if (net.cornice > 0) {
      const mats = [matLine(P, 'cornice', net.cornice)];
      push(roll(mats, net.cornice * num(P.labor.cornice), net.cornice, 'm', 'CEL-COR-01', 'item_cornice',
        `Length = P = ${net.cornice} m | Material × (1 + ${wasteOf(P, 'cornice')}%) | Labor = ${net.cornice} × ${P.labor.cornice} | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }
    if (net.ceilPaint > 0 && f.paintCeiling !== 'no') {
      const coats = num(P.general.wallPaintCoats, 2);
      const mats = [matLine(P, 'putty', net.ceilPaint * num(c.putty_kg_m2) * 0.8), matLine(P, 'primer', net.ceilPaint * num(c.primer_L_m2)), matLine(P, 'paint', net.ceilPaint * num(c.paint_L_m2_per_coat) * coats)];
      push(roll(mats, net.ceilPaint * num(P.labor.ceil_paint), net.ceilPaint, 'm²', 'CEL-PNT-01', 'item_ceil_paint',
        `Area = Ceil_Net − Gypsum = ${net.ceilPaint} m² | Paint = Area × ${c.paint_L_m2_per_coat} × ${coats} coats | Labor = Area × ${P.labor.ceil_paint} | Total = Direct × (1 + ${P.general.overheadPct}%)`));
    }
    return items;
  }

  /* ---------------- manual overrides ---------------- */
  function applyOverrides(items, room) {
    const mo = room.manual || {};
    items.forEach(it => {
      it.ov = { qty: null, rate: null, total: null };
      const m = mo[it.code] || mo[it.key];
      if (!m) return;
      if (m.qty) {
        it.ov.qty = m.qty;
        it.qty = num(m.qty.value, it.qty);
      }
      if (m.rate) {
        it.ov.rate = m.rate;
      }
      if (m.total) { it.ov.total = m.total; }
      // recompute item cost from possibly-overridden qty & rate
      const calcTotal = it.ov.total ? num(it.ov.total.value) : r2(it.qty * (it.ov.rate ? num(it.ov.rate.value) : it.rate));
      it.calcTotal = it.ov.total ? num(it.ov.total.original) : r2(it.qty * it.rate);
      it.total = calcTotal;
      it.rateApplied = it.ov.rate ? num(it.ov.rate.value) : it.rate;
      if (it.ov.total) it.rateApplied = it.qty > 0 ? r2(it.total / it.qty) : 0;
      it.totalDiff = r2(it.total - it.calcTotal);
    });
    return items;
  }

  /* ---------------- procurement aggregation ---------------- */
  function procurement(items, paramsIn) {
    const P = ensureParams(paramsIn);
    const map = {};
    items.forEach(it => it.mat.forEach(m => {
      if (!map[m.key]) map[m.key] = { key: m.key, unit: m.unit, net: 0, qty: 0, waste: m.waste, price: m.price, amount: 0 };
      map[m.key].net = r3(map[m.key].net + m.net);
      map[m.key].qty = r3(map[m.key].qty + m.qty);
      map[m.key].amount = r2(map[m.key].amount + m.amount);
    }));
    return Object.keys(map).map(k => {
      const m = map[k];
      return { key: k, unit: m.unit, net: r2(m.net), waste: m.waste, wasteQty: r2(m.qty - m.net), qty: r2(m.qty), price: m.price, amount: m.amount };
    }).sort((a, b) => b.amount - a.amount);
  }

  /* ---------------- QC + conflicts ---------------- */
  function qcList(room, paramsIn, items) {
    const d = global.EA_STORE.db();
    const f = room.fields || {};
    const keys = [];
    if (f.flooring === 'ceramic') keys.push('floor_ceramic');
    if (f.flooring === 'marble') keys.push('floor_marble');
    if (f.flooring === 'hdf') keys.push('floor_hdf');
    if (items.some(i => i.code === 'WAL-PNT-01')) keys.push('wall_paint');
    if (items.some(i => i.code === 'WAL-TIL-01')) keys.push('wall_tiles');
    if (items.some(i => i.code === 'CEL-GYP-01')) keys.push('ceil_gypsum');
    if (items.some(i => i.code === 'CEL-COR-01')) keys.push('cornice');
    if (items.some(i => i.code === 'SKR-01')) keys.push('skirting');
    const out = [];
    keys.forEach(k => {
      const rows = (d.qc && d.qc[k]) || (global.EA_DEFAULTS.DEFAULT_QC[k] || []);
      rows.forEach(r => out.push(Object.assign({ group: k }, r)));
    });
    const presentFinishes = keys;
    const conflicts = (d.matrix || global.EA_DEFAULTS.DEFAULT_MATRIX).filter(mx => presentFinishes.indexOf(mx.a) > -1 && presentFinishes.indexOf(mx.b) > -1);
    return { checks: out, conflicts, groups: keys, saved: room.qcResults || {} };
  }

  /* ---------------- WBS + performance (SPI) ---------------- */
  const STATUS_PROGRESS = { draft: 0.15, verified: 0.3, priced: 0.55, qc_ready: 0.8, closed: 1.0 };
  function wbs(room, paramsIn, items) {
    const d = global.EA_STORE.db();
    const rows = d.wbs || global.EA_DEFAULTS.DEFAULT_WBS;
    const total = items.reduce((s, i) => s + i.total, 0);
    const act = STATUS_PROGRESS[room.status || 'draft'] != null ? STATUS_PROGRESS[room.status || 'draft'] : 0.15;
    return rows.map(r => {
      const planned = 1;                       // planned completion of weights at this review point
      const actual = act;                      // actual uniform status-derived progress (transparent assumption)
      return {
        code: r.code, key: r.key, weight: num(r.weight), planned, actual,
        value: r2(total * num(r.weight) / 100),
        pctActual: pct(actual * num(r.weight) / 100),
        pctPlanned: pct(planned * num(r.weight) / 100),
        progress: pct(actual)
      };
    });
  }
  function spi(roomOrItems, wbsRows) {
    let ev = 0, pv = 0;
    wbsRows.forEach(r => { ev += r.weight * r.actual; pv += r.weight * r.planned; });
    return { ev: r3(ev / 100), pv: r3(pv / 100), spi: pv > 0 ? r2((ev / pv)) : 0 };
  }

  /* ---------------- productivity & schedule ---------------- */
  function schedule(items, paramsIn) {
    const P = ensureParams(paramsIn);
    const map = {
      'FLR-CER-01': 'floor_ceramic', 'FLR-MAR-01': 'floor_marble', 'FLR-HDF-01': 'floor_hdf',
      'SKR-01': 'skirting', 'WAL-PNT-01': 'wall_paint', 'WAL-TIL-01': 'wall_tiles',
      'CEL-GYP-01': 'ceil_gypsum', 'CEL-COR-01': 'cornice', 'CEL-PNT-01': 'wall_paint'
    };
    return items.map(it => {
      const key = map[it.code];
      const pr = key ? P.productivity[key] : null;
      const rate = pr ? num(pr.rate) : 0;
      const days = rate > 0 ? r2(it.qty / rate) : 0;
      return { code: it.code, prodKey: key, rate, unit: pr ? pr.unit : '', crew: pr ? num(pr.crew) : 0, days, qty: it.qty };
    });
  }

  /* ---------------- claims engine ---------------- */
  function milestoneStates(contractValue, progressPct, paramsIn) {
    const P = ensureParams(paramsIn);
    const ms = (P.milestones && P.milestones.length ? P.milestones : global.EA_DEFAULTS.DEFAULT_PARAMS.milestones);
    let cum = 0;
    return ms.map(m => {
      cum += num(m.pct);
      const start = cum - num(m.pct);
      const done = progressPct >= cum ? 'done' : (progressPct > start ? 'partial' : 'not');
      return { key: m.key, pct: num(m.pct), cum, value: r2(contractValue * num(m.pct) / 100), state: done };
    });
  }

  function buildClaim(cfg, paramsIn, room, items) {
    const P = ensureParams(paramsIn);
    const rows = items.map(it => {
      const prev = num(cfg.prevPct);
      const now = num(cfg.nowPct);
      const prevQty = r3(it.qty * prev / 100);
      const cumQty = r3(it.qty * now / 100);
      const curQty = r3(cumQty - prevQty);
      const rate = it.rateApplied != null ? it.rateApplied : it.rate;
      return {
        code: it.code, descKey: it.descKey, desc: it.desc, unit: it.unit,
        contractQty: it.qty, rate, contractVal: r2(it.qty * rate),
        prevQty, curQty, cumQty,
        cumPct: it.qty > 0 ? pct(cumQty / it.qty) : 0,
        execVal: r2(cumQty * rate), paidPrev: r2(prevQty * rate), dueCurrent: r2(curQty * rate)
      };
    });
    const gross = r2(rows.reduce((s, x) => s + x.dueCurrent, 0));
    const contractTotal = r2(rows.reduce((s, x) => s + x.contractVal, 0));
    const execTotal = r2(rows.reduce((s, x) => s + x.execVal, 0));
    const paidTotal = r2(rows.reduce((s, x) => s + x.paidPrev, 0));
    const advance = r2(gross * num(cfg.advancePct) / 100);
    const retention = r2(gross * num(cfg.retentionPct) / 100);
    const penalty = r2(num(cfg.penaltyAmount) > 0 ? num(cfg.penaltyAmount) : gross * num(cfg.penaltyPct) / 100);
    const other = r2(num(cfg.otherDeduction));
    const net = r2(gross - advance - retention - penalty - other);
    const overallProgress = num(cfg.nowPct);
    const milestones = milestoneStates(contractTotal, overallProgress, P);
    return {
      rows, gross, contractTotal, execTotal, paidTotal,
      advance, retention, penalty, other, net,
      overallProgress, milestones,
      cfg: JSON.parse(JSON.stringify(cfg)),
      eq: [
        `CumQty = ContractQty × ${overallProgress}% = e.g. ${rows[0] ? rows[0].cumQty + ' ' + rows[0].unit : ''}`,
        `Due_Current = CurQty × Rate | Gross = Σ Due_Current = ${gross}`,
        `Retention = Gross × ${num(cfg.retentionPct)}% = ${retention} | Advance = Gross × ${num(cfg.advancePct)}% = ${advance}`,
        `Net_Payable = Gross − Σ Deductions = ${gross} − ${r2(advance + retention + penalty + other)} = ${net}`
      ]
    };
  }

  /* ---------------- logic breakdown for a single item ---------------- */
  function explainItem(code, room, paramsIn) {
    const P = ensureParams(paramsIn);
    const { net } = computeRoom(room, P);
    const items = applyOverrides(buildItems(room, P, net), room);
    const it = items.find(x => x.code === code || x.key === code);
    if (!it) return null;
    return {
      item: it,
      lines: [
        { label: 'Take-off', txt: it.eq },
        { label: 'Materials', txt: it.mat.map(m => `${m.key}: net ${m.net} ${m.unit} × (1+${m.waste}%) = ${m.qty} ${m.unit} @ ${m.price} = ${m.amount}`).join(' ; ') },
        { label: 'Labor', txt: `Labor = Qty × rate = ${it.qty} × ${it.qty > 0 ? r2(it.labor / it.qty) : 0} = ${it.labor}` },
        { label: 'Equipment', txt: `Equip = Labor × ${it.equipPct}% = ${it.equip}` },
        { label: 'Direct', txt: `Direct = Mat(${it.matCost}) + Labor(${it.labor}) + Equip(${it.equip}) = ${it.direct}` },
        { label: 'Overheads & Profit', txt: `OH = Direct × ${it.ohPct}% = ${it.oh}` },
        { label: 'Total & Rate', txt: `Total = ${it.total} | Rate = Total/Qty = ${it.rate}/unit` },
        { label: 'Reference', txt: 'Wastage per material + deduct thresholds per code: paint/ceramic ≥ 1 m², marble/gypsum ≥ 0.5 m²' }
      ]
    };
  }

  /* ---------------- command parsing (/فراغ) ---------------- */
  function parseRoomCommand(text) {
    const s = String(text || '');
    const f = {};
    const get = (re) => { const m = s.match(re); return m ? m[1] : null; };
    f.L = parseFloat(get(/L\s*=\s*([\d.]+)/) || get(/طول\s*=\s*([\d.]+)/) || 0) || 0;
    f.W = parseFloat(get(/W\s*=\s*([\d.]+)/) || get(/عرض\s*=\s*([\d.]+)/) || 0) || 0;
    f.H = parseFloat(get(/H\s*=\s*([\d.]+)/) || get(/ارتفاع\s*=\s*([\d.]+)/) || 0) || 0;
    const fl = get(/أرضية\s*=\s*(\S+)/) || get(/flooring\s*=\s*(\S+)/);
    if (fl) f.flooring = /ceramic|سيراميك|بورسل/.test(fl) ? 'ceramic' : (/marble|رخام/.test(fl) ? 'marble' : (/hdf|باركيه|لارمينيت/.test(fl) ? 'hdf' : fl));
    const pt = get(/دهان\s*=\s*(\S+)/) || get(/paint\s*=\s*(\S+)/);
    if (pt) f.paintType = pt;
    const ow = get(/فتحات\s*=\s*([^\s]+)/) || get(/openings\s*=\s*(\S+)/);
    const openings = [];
    if (ow && ow !== '0') {
      // format 1:1.2x1.5,2:1x2.2  (count:w x h)
      ow.split(',').forEach(tok => {
        const m = tok.match(/^(\d+):([\d.]+)x([\d.]+)$/i);
        if (m) openings.push({ name: '', type: 'other', q: parseInt(m[1]), w: parseFloat(m[2]), h: parseFloat(m[3]) });
      });
    }
    // inline doors/windows: door 1x2.2  window 1.2x1.5
    s.replace(/(door|باب|window|شباك)\s*(\d+(?:\.\d+)?)\s*[x×]\s*(\d+(?:\.\d+)?)/gi, (all, kind, a, b) => {
      const type = /door|باب/i.test(kind) ? 'door' : 'window';
      openings.push({ name: '', type, q: 1, w: parseFloat(a), h: parseFloat(b) });
      return all;
    });
    const rt = get(/نوع\s*=\s*(\S+)/) || get(/room\s*=\s*(\S+)/);
    if (rt) f.roomType = /kitchen|مطبخ/.test(rt) ? 'kitchen' : (/bath|حمام|دورة/.test(rt) ? 'bathroom' : (/office|مكتب/.test(rt) ? 'office' : rt));
    return { fields: f, openings };
  }

  global.EA_ENGINE = {
    SUP, ensureParams, computeRoom, buildItems, applyOverrides, procurement,
    qcList, wbs, spi, schedule, buildClaim, milestoneStates, explainItem,
    parseRoomCommand, r2, r3, pct, num, matPrice, wasteOf, STATUS_PROGRESS
  };
  if (typeof module !== 'undefined') module.exports = global.EA_ENGINE;
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* ==== app.js ==== */
/* =========================================================

(function () {
  'use strict';

  const S = window.EA_STORE, E = window.EA_ENGINE, I = window.EA_I18N;

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const state = {
    lang: 'ar', theme: 'light', user: null,
    route: { name: 'dashboard', pid: null, rid: null, claimId: null },
    view: { stage: 1, out: null, claimCfg: null, claimResult: null, qcInspector: '' },
    pendingRoom: null, paletteOpen: false, paramsDraft: null, baseParams: null, baseTotals: null
  };
  window.EA = { state, ui: {} };

  /* ---------------- formatting ---------------- */
  const nf = (v, d) => new Intl.NumberFormat(I.nums(state.lang), { maximumFractionDigits: d == null ? 2 : d }).format(Number(v) || 0);
  const money = (v) => nf(v, 2) + ' ' + cur();
  const cur = () => state.lang === 'ar' ? (S.params().general.currencyAr || 'ج.م') : (S.params().general.currencyEn || 'EGP');
  const unitLabel = (u) => t(({ 'm²': 'u_m2', 'm': 'u_m', 'kg': 'u_kg', 'bag': 'u_bag', 'm³': 'u_m3', 'L': 'u_L', 'pc': 'u_pc', 'day': 'u_day' })[u] || 'u_m2');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dt = (iso) => { if (!iso) return '—'; try { return new Intl.DateTimeFormat(I.nums(state.lang), { dateStyle: 'short', timeStyle: 'short' }).format(new Date(iso)); } catch (e) { return iso; } };
  const todayISO = () => new Date().toISOString().slice(0, 10);

  /* ---------------- toast / dialog ---------------- */
  function toast(msg, type) {
    let host = $('.toast-host');
    if (!host) { host = document.createElement('div'); host.className = 'toast-host'; document.body.appendChild(host); }
    const d = document.createElement('div');
    d.className = 'toast ' + (type || ''); d.textContent = msg; host.appendChild(d);
    setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; setTimeout(() => d.remove(), 320); }, 2600);
  }
  function dialog(title, bodyHTML, buttons) {
    const dlg = document.createElement('dialog');
    dlg.innerHTML = `<form method="dialog" class="dlg-h"><span>${esc(title)}</span><button value="x" class="btn-sm btn-ghost">✕</button></form>
      <div class="dlg-b">${bodyHTML}</div><div class="dlg-f"></div>`;
    const f = $('.dlg-f', dlg);
    (buttons || [{ label: t('close'), value: 'x' }]).forEach(b => {
      const btn = document.createElement('button');
      btn.textContent = b.label; btn.value = b.value || 'x';
      if (b.cls) btn.className = b.cls;
      if (b.onClick) btn.addEventListener('click', (ev) => { const r = b.onClick(dlg, ev); if (r !== false) dlg.close(); });
      f.appendChild(btn);
    });
    document.body.appendChild(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.showModal();

  }
  window.EA.ui = { toast, dialog };
  function confirmBox(msg, onYes) {
    dialog(t('confirm_delete'), `<p>${esc(msg)}</p>`, [
      { label: t('cancel'), value: 'x' },
      { label: t('delete'), cls: 'btn-danger', onClick: () => { onYes(); } }
    ]);
  }

  /* ---------------- persistence helpers ---------------- */
  function computeRoom(room) {
    const base = S.db();
    const params = E.ensureParams(base.params);
    const { net, formula, dedSteps } = E.computeRoom(room, params);
    let items = E.applyOverrides(E.buildItems(room, params, net), room);
    return { params, net, formula, dedSteps, items, procurement: E.procurement(items, params), sched: E.schedule(items, params) };
  }
  function saveRoomNow(room, pid) {
    S.upsertRoom(pid, room); S.writeLocalSnapshot(); S.markSaved();

  }

  /* ---------------- language / theme ---------------- */
  function applyLang(l) {
    state.lang = l;

  }
  function applyTheme(th) {
    state.theme = th;

  }

  /* =========================================================
     ROUTER
     ========================================================= */
  function parseHash() {
    const h = (location.hash || '').replace(/^#\/?/, '');
    const [path, qs] = h.split('?');
    const parts = path.split('/').filter(Boolean);
    const q = {}; (qs || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); q[k] = decodeURIComponent(v || ''); });
    if (!parts.length) return { name: 'dashboard' };
    if (parts[0] === 'room') return { name: 'room', pid: q.pid || parts[1] || null, rid: q.rid || parts[2] || null };
    if (parts[0] === 'claim') return { name: 'claim', claimId: parts[1] || null };
    return { name: parts[0] };
  }
  function go(hash) { location.hash = hash; }
  function render() {

  }
  window.addEventListener('hashchange', render);

  /* =========================================================
     LOGIN
     ========================================================= */
  function loginView() {
    return `<div class="login-wrap"><div class="card login-card">
      <div class="center" style="margin-bottom:10px">
        <div style="width:56px;height:56px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 8px">⚙</div>
        <h2 style="margin:0">${esc(t('app_name'))}</h2>
        <div class="muted">${esc(t('app_tag'))}</div>
      </div>
      <div class="field"><label class="f">${esc(t('email'))}</label><input id="lg_email" type="email" autocomplete="username" placeholder="you@example.com"></div>
      <div class="field"><label class="f">${esc(t('password'))}</label><input id="lg_pw" type="password" autocomplete="current-password"></div>
      <div id="lg_err" class="bad"></div>
      <div class="btnrow" style="margin-top:10px">
        <button id="lg_go" class="btn-primary btn-lg">${esc(t('signin'))}</button>
        <button id="lg_lang" class="btn-ghost">${esc(t('lang_btn'))}</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <p class="small muted">${esc(t('invite_only'))}</p>
      <p class="small muted">${esc(t('app_name'))} · v1.0 — ${esc(t('all_rights'))}</p>
    </div></div>`;
  }
  function bindLogin() {
    $('#lg_lang').onclick = () => { applyLang(state.lang === 'ar' ? 'en' : 'ar'); render(); };
    const doLogin = async () => {
      const email = $('#lg_email').value.trim(), pw = $('#lg_pw').value;

  }
  function forcePwView() {
    return `<div class="login-wrap"><div class="card login-card">
      <h3>${esc(t('change_pw'))}</h3>
      <p class="small muted">${esc(t('change_pw_required'))}</p>
      <div class="field"><label class="f">${esc(t('cur_pw'))}</label><input id="fp_cur" type="password"></div>
      <div class="field"><label class="f">${esc(t('new_pw'))}</label><input id="fp_new" type="password"></div>

      <div class="btnrow" style="margin-top:10px"><button id="fp_go" class="btn-primary">${esc(t('save'))}</button>

  function bindForcePw() {

    $('#fp_go').onclick = async () => {

  function afterLogin() {
    // conflict detection: local crash-copy vs stored copy
    const snap = S.readLocalSnapshot();

    if (snap && snap.userId === (state.user || {}).id && storedAt && snap.at > storedAt) {
      const a = JSON.stringify(snap.projects || []), b = JSON.stringify(S.db().projects || []);
      if (a !== b) {
        dialog(t('conflict_title'), `<p class="small muted">${t('local_snapshot')}: ${esc(dt(snap.at))}<br>${t('server_snapshot')}: ${esc(dt(storedAt))}</p>`,
          [
            { label: t('keep_server'), value: 'x' },
            { label: t('keep_local'), onClick: () => { const d = S.db(); d.projects = snap.projects || d.projects; d.params = snap.params || d.params; S.saveDb(d); S.markSaved(); toast(t('saved_ok'), 'ok'); render(); } },
            {
              label: t('merge'), onClick: () => {
                const d = S.db();

                (d.projects || []).forEach(p => map[p.id] = p);

                  if (!map[p.id]) map[p.id] = p;
                  else {
                    const rm = {}; (map[p.id].rooms || []).forEach(r => rm[r.id] = r);
                    (p.rooms || []).forEach(r => { if (!rm[r.id] || (r.updatedAt || '') > (rm[r.id].updatedAt || '')) rm[r.id] = r; });

                });

              }
            }
          ]);
      }
    }
    go('#/dashboard'); render();
  }

  /* =========================================================
     SHELL + NAV
     ========================================================= */
  function navItems() {
    const items = [
      ['dashboard', 'nav_dashboard'], ['room', 'nav_room'], ['params', 'nav_params'],
      ['users', 'nav_users'], ['settings', 'nav_settings'], ['logs', 'nav_logs'], ['guide', 'nav_guide']
    ];
    return items.filter(([k]) => (k === 'params' || k === 'users' || k === 'logs') ? S.isAdmin() : true);
  }
  function shell(inner) {
    const r = state.route;
    return `<div class="pad-bottom">
      <header class="topbar no-print"><div class="wrap">
        <div class="brand"><span class="logo">⚙</span><span>${esc(t('app_name'))}<small>${esc(t('app_tag'))}</small></span></div>

  function tickSessionBar() {

  function wbsProjectPanel(list) {
    if (!list.length) return '';
    const rows = (S.db().wbs || window.EA_DEFAULTS.DEFAULT_WBS);
    const allRooms = list.flatMap(p => (p.rooms || []).map(r => r));
    const items = E.STATUS_PROGRESS;
    const avg = allRooms.length ? allRooms.reduce((s, r) => s + (items[r.status || 'draft'] || 0), 0) / allRooms.length : 0;
    const wbsRows = rows.map(r => ({ code: r.code, key: r.key, weight: r.weight, planned: 1, actual: avg, value: 0 }));
    const spi = E.spi(null, wbsRows);
    return `<div class="card"><h3>📊 ${esc(t('wbs_title'))}</h3>
      <p class="card-sub">${esc(t('spi_formula'))} — ${esc(t('ev'))}: ${nf(spi.ev, 3)} · ${esc(t('pv'))}: ${nf(spi.pv, 3)} · <b>SPI = ${nf(spi.spi, 2)}</b></p>

  function applyStandardTemplate() {
    const p = S.createProject({ name: 'Standard template project — ' + new Date().toLocaleDateString(), client: '', location: '' });
    const room = {
      id: null, name: 'Room 1 (5×4×3)', status: 'draft',
      fields: { L: 5, W: 4, H: 3, roomType: 'bedroom', shape: 'rect', flooring: 'ceramic', ceramicGrade: 'std', skirting: 'ceramic', wallType: 'paint', paintType: 'plastic', tilesDefaultH: 2.2, ceilingType: 'cornice', paintCeiling: 'yes', plaster: 'no' },
      openings: [{ name: 'Door', type: 'door', w: 1.0, h: 2.2, q: 1 }]
    };
    const cr = computeRoom(room);
    room.net = cr.net; room.formula = cr.formula; room.dedSteps = cr.dedSteps;
    room.totals = { mat: sum(cr.items, 'matCost'), labor: sum(cr.items, 'labor'), equip: sum(cr.items, 'equip'), direct: sum(cr.items, 'direct'), oh: sum(cr.items, 'oh'), total: sum(cr.items, 'total') };
    room.items = cr.items.map(flatItem);
    S.upsertRoom(p.id, room);
    S.writeLocalSnapshot(); toast(t('proj_saved'), 'ok'); render();
  }
  const sum = (arr, k) => E.r2(arr.reduce((s, x) => s + (Number(x[k]) || 0), 0));
  const flatItem = (it) => ({ code: it.code, descKey: it.descKey, unit: it.unit, qty: it.qty, rate: it.rate, total: it.total, eq: it.eq, mat: it.mat });

  /* =========================================================
     ROOM PAGE — 4 stages
     ========================================================= */
  function roomPageView(r) {
    let pid = r.pid, rid = r.rid;
    let room = null;
    if (!pid) { const projs = S.visibleProjects(); if (projs.length === 1) pid = projs[0].id; }
    if (rid === 'null' || rid === 'undefined') rid = null;
    if (pid && rid && rid !== 'new') room = S.findRoom(pid, rid);
    if (!room && state.pendingRoom) room = state.pendingRoom;
    if (!room) room = blankRoom();
    const roomKey = (pid || '') + '|' + (room.id || 'new');
    if (state.curKey !== roomKey) {
      state.curKey = roomKey;
      if (state.view.pendingStage == null) { state.view.stage = (room.id && (room.items || []).length) ? 3 : 1; state.view.out = null; }
    }
    if (state.view.pendingStage != null) { state.view.stage = state.view.pendingStage; state.view.pendingStage = null; }
    state.cur = { pid: pid, rid: room.id || null, room: room };

    const cr = room.fields && room.fields.L ? computeRoom(room) : null;
    const stage = state.view.stage;
    let html = '';
    if (stage === 1) html = stage1View(room, cr);
    else if (stage === 2) html = stage2View(room, cr, pid);
    else if (stage === 3) html = stage3View(room, cr);
    else html = stage4View(room, cr, pid);
    return html;
  }
  function blankRoom(fields) {
    return {
      id: null, name: state.lang === 'ar' ? 'فراغ جديد' : 'New room', status: 'draft',

      openings: []

  function openingsRows(room) {
    const ops = room.openings || [];
    if (!ops.length) return `<tr><td colspan="7" class="muted small">—</td></tr>`;
    return ops.map((o, i) => `<tr>
      <td><input data-op="name" data-i="${i}" value="${esc(o.name || '')}"></td>
      <td><select data-op="type" data-i="${i}">
        <option value="door" ${o.type === 'door' ? 'selected' : ''}>${esc(t('op_door'))}</option>
        <option value="window" ${o.type === 'window' ? 'selected' : ''}>${esc(t('op_window'))}</option>
        <option value="other" ${o.type !== 'door' && o.type !== 'window' ? 'selected' : ''}>${esc(t('op_other'))}</option></select></td>
      <td class="num"><input data-op="w" data-i="${i}" type="number" step="0.01" value="${esc(o.w)}" style="min-width:80px"></td>
      <td class="num"><input data-op="h" data-i="${i}" type="number" step="0.01" value="${esc(o.h)}" style="min-width:80px"></td>
      <td class="num"><input data-op="q" data-i="${i}" type="number" step="1" min="1" value="${esc(o.q || 1)}" style="min-width:60px"></td>
      <td class="num">${nf((Number(o.w) || 0) * (Number(o.h) || 0) * (Number(o.q) || 1), 2)}</td>
      <td><button class="btn-sm btn-danger" data-delop="${i}">🗑</button></td></tr>`).join('');
  }
  function bindRoomPage(r) {
    const cur = state.cur; if (!cur) return;
    const room = cur.room;
    if (state.view.stage === 1) {
      $$('[data-addop]').forEach(b => b.onclick = () => {
        readRoomForm(room);
        const kind = b.dataset.addop;
        const P = S.params();
        room.openings.push(kind === 'door' ? { name: t('op_door'), type: 'door', w: P.std.doorW, h: P.std.doorH, q: 1 }
          : kind === 'window' ? { name: t('op_window'), type: 'window', w: P.std.winW, h: P.std.winH, q: 1 }
            : { name: '', type: 'other', w: 1, h: 1, q: 1 });
        state.cur.room = room; render();
      });
      $$('[data-delop]').forEach(b => b.onclick = () => { readRoomForm(room); room.openings.splice(Number(b.dataset.delop), 1); state.cur.room = room; render(); });
      $$('#op_tab [data-op]').forEach(inp => inp.onchange = () => {
        readRoomForm(room); const i = Number(inp.dataset.i), k = inp.dataset.op;
        room.openings[i][k] = (k === 'w' || k === 'h' || k === 'q') ? Number(inp.value) : inp.value;
        state.cur.room = room; render();
      });
      $('#rf_go').onclick = () => {
        readRoomForm(room);
        const miss = [];
        if (!(Number(room.fields.L) > 0)) miss.push(t('length'));
        if (!(Number(room.fields.W) > 0)) miss.push(t('width'));
        if (!(Number(room.fields.H) > 0)) miss.push(t('height'));
        if (miss.length) { $('#rf_err').textContent = t('verify_missing') + ' ' + miss.join('، '); return; }
        let pid = $('#r_pid').value;
        if (!pid) { const p = S.createProject({ name: room.name || 'Project', client: '', location: '' }); pid = p.id; }
        room.status = room.status === 'draft' ? 'verified' : room.status;
        saveRoomNow(room, pid);
        state.cur.pid = pid; state.cur.rid = room.id;
        state.view.pendingStage = 2;
        go('#/room?pid=' + pid + '&rid=' + room.id); render();
      };
    }
    if (state.view.stage === 2) {
      $('#s2_menu').onclick = () => { state.view.stage = 3; render(); };
      $('#s2_edit').onclick = () => { state.view.stage = 1; render(); };
    }
    if (state.view.stage === 3) {
      $$('[data-out]').forEach(c => c.onclick = () => { state.view.out = Number(c.dataset.out); state.view.stage = 4; render(); });
      const s3e = $('#s3_edit'); if (s3e) s3e.onclick = () => { state.view.stage = 2; render(); };
      const s3e1 = $('#s3_edit1'); if (s3e1) s3e1.onclick = () => { state.view.stage = 1; render(); };
    }
    if (state.view.stage === 4) bindStage4(cur);
  }
  function readRoomForm(room) {
    const g = (id) => { const el = $('#' + id); return el ? el.value : ''; };
    room.name = g('rf_name') || room.name;
    room.fields = Object.assign({}, room.fields, {
      L: Number(g('rf_L')) || 0, W: Number(g('rf_W')) || 0, H: Number(g('rf_H')) || 0,
      shape: g('rf_shape'), roomType: g('rf_type'),
      wallsZeroCorner: Number(g('rf_perim')) || 0, plasterP: Number(g('rf_plasterP')) || 0, plaster: g('rf_plaster'),
      flooring: g('rf_flooring'), ceramicGrade: g('rf_grade'), skirting: g('rf_skirt'),
      wallType: g('rf_walltype'), tilesDefaultH: Number(g('rf_tilesH')) || 0, paintType: g('rf_paint'),
      ceilingType: g('rf_ceil'), gypsumArea: Number(g('rf_gyp')) || 0,
      tilesFullHeight: ($('#rf_fulltiles') && $('#rf_fulltiles').checked) ? 'yes' : 'no',
      paintCeiling: ($('#rf_paintceil') && $('#rf_paintceil').checked) ? 'yes' : 'no'

      ${rows.map(([k, v, u, eq]) => `<tr><td>${esc(t(k))}</td><td class="num act">${nf(v, 2)}</td><td>${esc(unitLabel(u))}</td><td class="small muted mono">${esc(t(eq))}</td></tr>`).join('')}

      </tbody></table></div>
      <div class="eq-note"><h4>${esc(t('st2'))} — ${esc(t('eq_floor'))}</h4><ul>

      </ul></div>
      <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>${esc(t('op_name'))}</th><th class="num">${esc(t('op_w'))}×${esc(t('op_h'))}</th><th class="num">${esc(t('op_q'))}</th><th class="num">${esc(t('u_m2'))}</th>
        <th>${esc(t('item_wall_paint'))}</th><th>${esc(t('item_wall_tiles'))}</th><th>${esc(t('item_floor_marble'))}</th></tr></thead><tbody>
        ${cr.dedSteps.length ? cr.dedSteps.map(d => `<tr><td>${esc(d.name)}</td><td class="num">${nf(d.w, 2)}×${nf(d.h, 2)}</td><td class="num">${d.n}</td><td class="num">${nf(d.tot, 2)}</td>
        <td>${d.paint ? '✅ ' + esc(t('open_ded_note')) : '—'}</td><td>${d.tile ? '✅' : '—'}</td><td>${d.marble ? '✅' : '—'}</td></tr>`).join('') : `<tr><td colspan="7" class="muted">—</td></tr>`}
      </tbody></table></div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn-primary btn-lg" id="s2_menu">${esc(t('st3'))} →</button>
        <button id="s2_edit">${esc(t('back'))} — ${esc(t('st1'))}</button>
      </div>
    </div>`;
  }

  /* ---------- Stage 3: action menu ---------- */
  function stage3View(room) {
    const items = [[1, 'm1'], [2, 'm2'], [3, 'm3'], [4, 'm4']];
    return `<div class="stage-badge s3">${esc(t('st3'))}</div>
    <div class="card"><h3>${esc(t('menu_title'))}</h3>
      <div class="menu">
        ${items.map(([n, k]) => `<button class="menu-item" data-out="${n}"><span class="n">${n}</span><span><b>${esc(t(k))}</b></span></button>`).join('')}
      </div>
      <div class="btnrow" style="margin-top:10px">
        <button id="s3_edit">← ${esc(t('st2'))}</button>
        <button id="s3_edit1">← ${esc(t('st1'))}</button>
        <span class="muted small">${esc(t('menu_choose'))}</span>
      </div>
    </div>`;
  }

  /* ---------- Stage 4: single output ---------- */
  function stage4View(room, cr, pid) {
    if (!cr) cr = computeRoom(room);
    const out = state.view.out;
    let body = '';
    if (out === 1) body = outProcurement(room, cr);
    else if (out === 2) body = outPricing(room, cr);
    else if (out === 3) body = outQC(room, cr);
    else body = outClaim(room, cr, pid);
    return `<div class="stage-badge s4">${esc(t('st4'))} — ${esc(t('phase_hint'))} #${out}</div>
      ${body}
      <div class="card no-print">
        <div class="btnrow">
          <button class="btn-primary" id="s4_ok">${esc(t('direct_ok'))}</button>
          <button id="s4_back">${esc(t('back_menu'))}</button>
          <a class="btn" href="#/params">${esc(t('edit_formula_link'))}</a>
          <span class="muted small">${esc(t('confirm_end'))}</span>
        </div>
      </div>`;
  }
  function bindStage4(cur) {
    const room = cur.room;
    const cr = computeRoom(room);
    $('#s4_back').onclick = () => { state.view.stage = 3; render(); };
    $('#s4_ok').onclick = () => {
      const out = state.view.out;
      if (out === 2) room.status = 'priced';
      if (out === 3) room.status = 'qc_ready';
      if (out === 4) room.status = 'closed';
      room.totals = { mat: sum(cr.items, 'matCost'), labor: sum(cr.items, 'labor'), equip: sum(cr.items, 'equip'), direct: sum(cr.items, 'direct'), oh: sum(cr.items, 'oh'), total: sum(cr.items, 'total') };
      room.items = cr.items.map(flatItem);
      saveRoomNow(room, cur.pid);
      toast(t('saved_ok') + ' — ' + t('st_' + room.status), 'ok');
      state.view.stage = 3; render();
    };
    bindOverrides(cur, cr);
    bindQc(cur, cr);
    bindClaimForm(cur, cr);
    $$('[data-logic]').forEach(b => b.onclick = () => showLogic(room, b.dataset.logic, cr));
    $$('[data-dl-csv]').forEach(b => b.onclick = () => downloadOutputCsv(room, cr, b.dataset.dlCsv));
    $$('[data-dl-md]').forEach(b => b.onclick = () => downloadMarkdown(room, cr, state.view.out));
  }

    const tot = E.r2(rows.reduce((s, r) => s + r.amount, 0));
    return `<div class="card"><h3>🛒 ${esc(t('out_purch'))} — ${esc(room.name)}</h3>
      <div class="btnrow no-print" style="margin-bottom:8px">
        <button class="btn-sm" data-dl-csv="proc">${esc(t('btn_download_csv'))}</button>
        <button class="btn-sm" data-dl-md="1">${esc(t('md_export'))}</button>
      </div>
      <div class="tablewrap"><table><thead><tr>
        <th>#</th><th>${esc(t('pur_item'))}</th><th>${esc(t('pur_unit'))}</th><th class="num">${esc(t('pur_net'))}</th>
        <th class="num">${esc(t('pur_waste_rate'))}</th><th class="num">${esc(t('pur_waste_qty'))}</th><th class="num">${esc(t('pur_total'))}</th>
        <th class="num">${esc(t('pur_unit_price'))}</th><th class="num">${esc(t('pur_total_price'))}</th></tr></thead><tbody>

        <tr><td colspan="8" class="right"><b>${esc(t('totals_row'))}</b></td><td class="num"><b>${esc(money(tot))}</b></td></tr>
      </tbody></table></div>
      <div class="eq-note no-print"><h4>${esc(t('btn_view_logic'))} — Glass-Box</h4><ul>
        <li class="mono">[Equation] ${esc(t('eq_mat'))}</li>
        <li class="mono">[Wastage] ${Object.keys(S.params().wastage).map(k => k + '=' + S.params().wastage[k] + '%').join(' · ')}</li>
        <li class="mono">[Consumption] ${Object.keys(S.params().consumption).map(k => k + '=' + S.params().consumption[k]).join(' · ')}</li>

      ${itemLogicTable(cr)}

  function itemLogicTable(cr) {
    return `<div class="tablewrap" style="margin-top:10px"><table><thead><tr>

      ${cr.items.map(it => `<tr><td class="mono">${esc(it.code)}</td><td>${esc(t(it.descKey))}</td>
        <td class="small mono">${esc(it.eq)}</td><td class="no-print"><button class="btn-sm" data-logic="${it.code}">${esc(t('btn_view_logic'))}</button></td></tr>`).join('')}
    </tbody></table></div>`;
  }

  /* ----- Output 2: pricing / BOQ ----- */
  function outPricing(room, cr) {
    const tot = { mat: sum(cr.items, 'matCost'), labor: sum(cr.items, 'labor'), equip: sum(cr.items, 'equip'), direct: sum(cr.items, 'direct'), oh: sum(cr.items, 'oh'), total: sum(cr.items, 'total') };
    const P = S.params();
    return `<div class="card"><h3>💰 ${esc(t('out_price'))} — ${esc(room.name)}</h3>
      <div class="btnrow no-print" style="margin-bottom:8px">
        <button class="btn-sm" data-dl-csv="boq">${esc(t('btn_download_csv'))}</button>
        <button class="btn-sm" data-dl-md="2">${esc(t('md_export'))}</button>
        <span class="chip">${esc(t('p_overhead'))}: ${nf(P.general.overheadPct, 2)}%</span>
        <span class="chip info">${esc(t('p_equip'))}: ${nf(P.general.equipmentPctOfLabor, 2)}%</span>
      </div>
      <div class="tablewrap"><table><thead><tr>

        <th class="num">${esc(t('qs_mat'))}</th><th class="num">${esc(t('qs_lab'))}</th><th class="num">${esc(t('qs_eqp'))}</th>
        <th class="num">${esc(t('qs_direct'))}</th><th class="num">${esc(t('qs_oh'))}</th><th class="num">${esc(t('qs_total'))}</th>
        <th class="num">${esc(t('dt_price'))}</th><th class="no-print">${esc(t('ov_title'))}</th></tr></thead><tbody>
        ${cr.items.map(it => {
      const ov = room.manual && room.manual[it.code];
      return `<tr class="${ov ? 'is-overridden' : ''}"><td class="mono">${esc(it.code)}</td><td>${esc(t(it.descKey))} ${ov ? '<span class="chip warn">' + esc(t('ov_active')) + '</span>' : ''}</td>
          <td>${esc(unitLabel(it.unit))}</td><td class="num">${nf(it.qty, 2)}</td>
          <td class="num">${nf(it.matCost, 2)}</td><td class="num">${nf(it.labor, 2)}</td><td class="num">${nf(it.equip, 2)}</td>
          <td class="num">${nf(it.direct, 2)}</td><td class="num">${nf(it.oh, 2)}</td><td class="num act">${nf(it.total, 2)}</td>
          <td class="num">${nf(it.rateApplied != null ? it.rateApplied : it.rate, 2)}</td>
          <td class="no-print nowrap"><button class="btn-sm" data-logic="${it.code}">🔍</button>

          <button class="btn-sm btn-danger" data-rmov="${it.code}">✕</button></td></tr>`;
    }).join('')}
        <tr><td colspan="4" class="right"><b>${esc(t('totals_row'))}</b></td><td class="num"><b>${nf(tot.mat, 2)}</b></td><td class="num"><b>${nf(tot.labor, 2)}</b></td>
        <td class="num"><b>${nf(tot.equip, 2)}</b></td><td class="num"><b>${nf(tot.direct, 2)}</b></td><td class="num"><b>${nf(tot.oh, 2)}</b></td>
        <td class="num"><b>${esc(money(tot.total))}</b></td><td colspan="2"></td></tr>
      </tbody></table></div>

      <div class="section-title" style="margin-top:14px">⏱ ${esc(t('sched_title'))}</div>
      <div class="tablewrap"><table><thead><tr><th>${esc(t('qs_code'))}</th><th class="num">${esc(t('p_rate'))}</th><th class="num">${esc(t('p_crew'))}</th><th class="num">${esc(t('days_needed'))}</th></tr></thead><tbody>
      ${cr.sched.map(s => `<tr><td class="mono">${esc(s.code)}</td><td class="num">${nf(s.rate, 2)} ${esc(unitLabel(s.unit))}</td><td class="num">${nf(s.crew, 0)}</td><td class="num">${nf(s.days, 2)} ${esc(t('days'))}</td></tr>`).join('')}

      <div class="eq-note no-print"><h4>Glass-Box</h4><ul>
        <li class="mono">[Equation] Direct = Mat + Labor + Equip ; Equip = Labor × ${nf(P.general.equipmentPctOfLabor, 2)}%</li>

  function bindOverrides(cur, cr) {
    $$('[data-ov]').forEach(b => b.onclick = () => {
      const code = b.dataset.ov;
      const it = cr.items.find(x => x.code === code);
      dialog(t('ov_title') + ' — ' + t(it.descKey), `
        <div class="detail-row"><span>${esc(t('ov_original'))}</span><b>${nf(it.calcTotal != null ? it.calcTotal : it.total, 2)}</b></div>
        <div class="field"><label class="f">${esc(t('ov_new'))} — ${esc(t('value_col'))} (${esc(cur.room ? t('qs_total') : '')})</label><input id="ov_val" type="number" step="0.01" value="${nf((room_ov(cur, code) || {}).total ? room_ov(cur, code).total.value : (it.calcTotal != null ? it.calcTotal : it.total), 2)}"></div>
        <div class="field"><label class="f">${esc(t('ov_reason'))}</label><input id="ov_rs" placeholder="${esc(t('reason'))}"></div>`,
        [{ label: t('cancel') }, {
          label: t('ov_apply'), cls: 'btn-primary', onClick: (dlg) => {
            const v = Number($('#ov_val', dlg).value), rs = $('#ov_rs', dlg).value.trim();
            if (!rs) { toast(t('ov_reason_required'), 'danger'); return false; }
            const room = cur.room; room.manual = room.manual || {};
            const orig = it.calcTotal != null ? it.calcTotal : it.total;
            room.manual[code] = Object.assign(room.manual[code] || {}, { total: { value: v, original: orig, reason: rs, at: S.nowISO(), by: S.currentUser().name } });
            saveRoomNow(room, cur.pid);
            S.log('act_override', t(it.descKey) + ' = ' + v, { itemKey: code, oldVal: orig, newVal: v, reason: rs });
            toast(t('ov_logged'), 'ok'); render();
          }
        }]);
    });
    $$('[data-rmov]').forEach(b => b.onclick = () => {
      const room = cur.room; if (room.manual) { delete room.manual[b.dataset.rmov]; saveRoomNow(room, cur.pid); toast(t('ov_clear'), 'ok'); render(); }
    });
  }
  const room_ov = (cur, code) => (cur.room && cur.room.manual) ? cur.room.manual[code] : null;

  function showLogic(room, code, cr) {
    const ex = E.explainItem(code, room, S.params());
    if (!ex) return;
    dialog(t('btn_view_logic') + ' — ' + t(ex.item.descKey), `
      <div class="small mono" style="word-break:break-word">
        ${ex.lines.map(l => `<div class="detail-row"><span>${esc(l.label)}</span></div><div class="mono small" style="margin:-4px 0 8px">${esc(l.txt)}</div>`).join('')}
      </div>`, [{ label: t('close') }]);
  }

  /* ----- Output 3: QC ----- */
  function outQC(room, cr) {
    const q = E.qcList(room, S.params(), cr.items);
    const saved = room.qcResults || {};

    return { name: 'test', fields: { L: 5, W: 4, H: 3, roomType: 'bedroom', shape: 'rect', flooring: 'ceramic', ceramicGrade: 'std', skirting: 'ceramic', wallType: 'both', tilesDefaultH: 2.2, paintType: 'plastic', ceilingType: 'gypsum', gypsumArea: 0, paintCeiling: 'yes', plaster: 'no' }, openings: [{ name: 'door', type: 'door', w: 1, h: 2.2, q: 1 }, { name: 'win', type: 'window', w: 1.2, h: 1.5, q: 1 }] };

  function paramsView() {
    const P = E.ensureParams(S.params());
    state.baseParams = JSON.parse(JSON.stringify(P));
    state.paramsDraft = JSON.parse(JSON.stringify(P));
    const tot = sum(E.buildItems(testRoom(), P, E.computeRoom(testRoom(), P).net), 'total');
    state.baseTotals = tot;
    const label = (sec, k) => {
      const names = {
        wastage: { ceramic: t('mat_ceramic_tile'), marble: t('mat_marble'), paint: t('mat_paint'), gypsum: t('mat_gypsum_board'), cement: t('mat_cement'), sand: t('mat_sand'), adhesive: t('mat_adhesive'), hdf: t('mat_hdf'), skirting: t('mat_skirting') },
        prices: (k) => t('mat_' + k),
        labor: { floor_ceramic: t('item_floor_ceramic'), floor_marble: t('item_floor_marble'), floor_hdf: t('item_floor_hdf'), skirting: t('item_skirting'), wall_paint: t('item_wall_paint'), wall_tiles: t('item_wall_tiles'), ceil_gypsum: t('item_gypsum'), ceil_paint: t('item_ceil_paint'), cornice: t('item_cornice'), plaster: t('item_plaster') },
        consumption: (k) => k.replace(/_/g, ' '),
        productivity: (k) => t('item_' + (k === 'wall_tiles' ? 'wall_tiles' : k === 'ceil_gypsum' ? 'gypsum' : k === 'cornice' ? 'cornice' : k === 'skirting' ? 'skirting' : k === 'wall_paint' ? 'wall_paint' : k === 'floor_hdf' ? 'floor_hdf' : k === 'floor_marble' ? 'floor_marble' : 'floor_ceramic')),
        payment: { retentionPct: t('retention_pct'), advancePct: t('advance_pct'), delayPenaltyPerDayPct: t('penalty_pct') }
      };
      const n = names[sec];
      if (!n) return k;
      if (typeof n === 'function') return n(k);
      return n[k] || k;
    };
    const sections = PARAM_SCHEMA.map(s => {
      const obj = P[s.sec] || {};
      const keys = s.keys ? s.keys : (s.msMode ? obj.map(m => [m.key, 'ms_' + m.key]) : Object.keys(obj).map(k => [k, null]));
      return `<div class="card"><h3>⚙ ${esc(t(s.label))}</h3>
        <div class="tablewrap"><table><thead><tr><th>${esc(t('param_key'))}</th><th class="num">${esc(t('param_old'))}</th><th class="num">${esc(t('param_new'))}</th><th>${esc(t('reason'))}</th></tr></thead><tbody>
        ${keys.map(([k, lk]) => {
        const path = s.sec + '.' + k;
        return `<tr><td>${esc(lk ? t(lk) : label(s.sec, k))}<div class="mini mono">${esc(path)}</div></td>
            <td class="num mini" id="old_${css(path)}">${nf(getPath(P, path), 3)}</td>
            <td class="num"><input data-path="${path}" type="number" step="any" value="${esc(getPath(P, path))}" style="min-width:110px"></td>
            <td><input data-reason="${path}" placeholder="${esc(t('reason'))}"></td></tr>`;
      }).join('')}
        </tbody></table></div></div>`;
    }).join('');

    return `<div class="stage-badge">${esc(t('nav_params'))}</div>
      <div class="card"><h3>${esc(t('changes_title'))}</h3>
        <p class="card-sub">${esc(t('admin_only'))} · ${esc(t('param_ref_calc'))}</p>
        <div id="impact" class="glass small">—</div>
      </div>
      ${sections}
      <div class="card"><div class="btnrow">
        <button class="btn-primary btn-lg" id="pr_apply">${esc(t('changes_title'))} → ${esc(t('apply_changes'))}</button>
        <button id="pr_discard">${esc(t('discard'))}</button>
        <button class="btn-danger" id="pr_reset">${esc(t('param_reset'))}</button>
      </div></div>`;
  }
  const css = (s) => s.replace(/[^a-z0-9]/gi, '_');
  function getPath(o, p) { return p.split('.').reduce((a, k) => (a ? a[k] : undefined), o); }
  function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); let cur = o; ks.forEach(k => { if (!cur[k]) cur[k] = {}; cur = cur[k]; }); cur[last] = v; }
  function bindParams() {
    const recompute = () => {
      const base = sum(E.buildItems(testRoom(), state.baseParams, E.computeRoom(testRoom(), state.baseParams).net), 'total');
      const now = sum(E.buildItems(testRoom(), state.paramsDraft, E.computeRoom(testRoom(), state.paramsDraft).net), 'total');
      const diff = E.r2(now - base);
      const list = [];
      $$('[data-path]').forEach(inp => {
        const oldV = getPath(state.baseParams, inp.dataset.path);
        if (Number(inp.value) !== Number(oldV)) list.push(`<li class="mono">${esc(inp.dataset.path)}: <b>${nf(oldV, 3)}</b> → <b>${nf(inp.value, 3)}</b></li>`);
      });
      $('#impact').innerHTML = `<div class="detail-row"><span>${esc(t('param_ref_calc'))}</span><b>${esc(money(base))} → ${esc(money(now))} <span class="chip ${diff > 0 ? 'danger' : (diff < 0 ? 'ok' : '')}">Δ ${nf(diff, 2)}</span></b></div>
        ${list.length ? '<ul style="margin:6px 0 0">' + list.join('') + '</ul>' : '<div class="muted mini">' + esc(t('s_sync')) + ': ' + esc(t('synced_ok')) + '</div>'}`;
    };
    $$('[data-path]').forEach(inp => inp.oninput = () => {
      setPath(state.paramsDraft, inp.dataset.path, Number(inp.value));
      recompute();
    });
    recompute();
    $('#pr_apply').onclick = () => {
      if (!S.isAdmin()) { toast(t('no_rights'), 'danger'); return; }
      const reasons = [];
      $$('[data-path]').forEach(inp => {
        const oldV = getPath(S.params(), inp.dataset.path), newV = Number(inp.value);
        if (Number(oldV) !== newV) {
          const rsEl = $(`[data-reason="${inp.dataset.path}"]`);
          const rs = rsEl && rsEl.value.trim() ? rsEl.value.trim() : '—';
          reasons.push({ path: inp.dataset.path, oldV, newV, rs });
        }
      });
      if (!reasons.length) { toast(t('s_sync') + ' ✓', 'ok'); return; }
      const d = S.db();
      reasons.forEach(r => setPath(d.params, r.path, r.newV));
      S.saveDb(d); S.markSaved(); S.writeLocalSnapshot();
      reasons.forEach(r => S.log('act_param', r.path, { oldVal: r.oldV, newVal: r.newV, reason: r.rs }));
      toast(t('param_saved'), 'ok'); render();
    };
    $('#pr_discard').onclick = () => { render(); };
    $('#pr_reset').onclick = () => confirmBox(t('param_reset') + '?', () => {
      const d = S.db(); d.params = JSON.parse(JSON.stringify(window.EA_DEFAULTS.DEFAULT_PARAMS)); S.saveDb(d); S.log('act_param', 'reset to defaults'); render();
    });
  }
